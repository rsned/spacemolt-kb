<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship Fitting Sheet - Spacemolt KB</title>
<style>
/* ---------------------------------------------------------------------------
   Cyanotype. Same palette and line-work as the blueprint sheets in
   data/footprints/blueprints/make_blueprints.py, extended to a whole page.
   --------------------------------------------------------------------------- */
:root{
  --blue:#123d75;          /* classic cyanotype field */
  --blue-deep:#0b2a52;     /* page ground behind the sheet */
  --line:#eaf2ff;          /* white line-work */
  --dim:rgba(234,242,255,.80);     /* table + section labels */
  --faint:rgba(234,242,255,.55);   /* breakdowns, hints, placeholders */
  --rule:rgba(234,242,255,.34);
  --shield:#9fe4ff;        /* vibrant blue-white shield trace */
  --pen:#ff9d8a;           /* penalties, over-capacity */
  --ok:#8ee6b8;
  --shield-lost:#b9c7dc;   /* rings trimmed by a shield penalty */
  --grid-a:rgba(234,242,255,.072); /* fine drafting grid */
  --grid-b:rgba(234,242,255,.16);  /* major drafting grid */
  --gap:14px;
}
/* LIGHT: ink-on-paper drafting sheet. DARK: graphite. BLUEPRINT is the
   bare :root default. The switcher (top right) cycles and persists. */
html[data-theme="light"]{
  --blue:#f4f1e8;
  --blue-deep:#e7e2d4;
  --line:#1b3a66;
  --dim:rgba(27,58,102,.82);
  --faint:rgba(27,58,102,.55);
  --rule:rgba(27,58,102,.34);
  --shield:#0e7fa8;
  --shield-lost:#8fa3bc;
  --pen:#b3362a;
  --ok:#1e7a4e;
  --grid-a:rgba(27,58,102,.07);
  --grid-b:rgba(27,58,102,.16);
}
html[data-theme="dark"]{
  --blue:#1b1d22;
  --blue-deep:#101114;
  --line:#d7dde6;
  --dim:rgba(215,221,230,.82);
  --faint:rgba(215,221,230,.55);
  --rule:rgba(215,221,230,.30);
  --shield:#7fd4f2;
  --shield-lost:#7f8a99;
  --grid-a:rgba(215,221,230,.06);
  --grid-b:rgba(215,221,230,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--blue-deep);
  color:var(--line);
  font:14px/1.45 'Courier New',ui-monospace,monospace;
  letter-spacing:.09em;
  padding:18px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--line)}

/* The sheet: drafting grid + the blueprints' heavy double border. */
.sheet{
  position:relative;
  max-width:1680px;margin:0 auto;
  background:var(--blue);
  background-image:
    repeating-linear-gradient(to right,var(--grid-a) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,var(--grid-a) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to right,var(--grid-b) 0 1px,transparent 1px 120px),
    repeating-linear-gradient(to bottom,var(--grid-b) 0 1px,transparent 1px 120px);
  border:2.5px solid var(--line);
  padding:10px;
}
.sheet::before{
  content:"";position:absolute;inset:5px;border:1px solid var(--line);
  opacity:.75;pointer-events:none;
}
.inner{position:relative;padding:16px 20px 12px}

/* --- header ------------------------------------------------------------- */
.sheet-head{
  display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end;
  justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:16px;
}
.brand{font-size:19.5px;font-weight:bold;letter-spacing:.26em;white-space:nowrap}
.brand .back{display:block;font-size:11px;font-weight:normal;letter-spacing:.22em;
  color:var(--dim);text-decoration:none;margin-bottom:7px}
.brand .back:hover{color:var(--line)}
.brand small{display:block;font-size:11.5px;font-weight:normal;letter-spacing:.2em;
  color:var(--dim);margin-top:5px}
.controls{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl>span{font-size:11px;letter-spacing:.22em;color:var(--dim)}
select,input[type=number]{
  background:transparent;color:var(--line);
  border:0;border-bottom:1px solid var(--line);
  font:inherit;letter-spacing:.1em;padding:4px 2px;
  border-radius:0;outline:none;
}
select:focus,input:focus{border-bottom-color:var(--shield);
  box-shadow:0 1px 0 0 var(--shield)}
select option,select optgroup{background:var(--blue);color:var(--line)}
#ship{width:clamp(280px,55vw,600px);font-size:clamp(13px,1.4vw,16px);flex:none}
.engwrap{display:flex;align-items:center;gap:12px}
#engNum{width:58px;text-align:right;font-size:16px}
#engRange{width:150px;accent-color:var(--shield);background:transparent}
.engnote{font-size:11px;color:var(--dim);letter-spacing:.16em;
  width:150px;flex:none;white-space:nowrap}

/* --- body grid ---------------------------------------------------------- */
.body{display:grid;grid-template-columns:minmax(380px,42fr) 58fr;gap:22px;align-items:start}
@media (max-width:1200px){
  .body{grid-template-columns:1fr}
  #planWrap{max-width:520px;margin:0 auto}
}

.panel{border:1px solid var(--rule);padding:14px 16px 12px;position:relative}
.panel>h2{
  margin:0 0 10px;font-size:11.5px;font-weight:bold;letter-spacing:.26em;
  color:var(--dim);display:flex;justify-content:space-between;align-items:baseline;gap:12px;
}
.panel>h2 em{font-style:normal;color:var(--faint);letter-spacing:.16em;font-weight:normal}

/* --- plan view ---------------------------------------------------------- */
.plan svg{display:block;width:100%;height:auto}
.plan-legend{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;
  color:var(--dim);letter-spacing:.16em;align-items:center;
}
.plan-legend b{color:var(--line);font-weight:bold}
.swatch{display:inline-block;width:16px;height:0;border-top:2px solid var(--shield);
  vertical-align:middle;margin-right:5px}
.swatch.dash{border-top-style:dashed;border-top-color:var(--faint)}
.plan-legend .why{margin-left:18px;color:var(--faint)}
.plan-legend .none{color:var(--faint);letter-spacing:.18em}

/* --- slots -------------------------------------------------------------- */
.slotgrid{display:grid;gap:16px}
.slotgroup{}
.slotgroup h3{
  margin:0 0 7px;font-size:11.5px;letter-spacing:.24em;color:var(--line);
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--rule);padding-bottom:5px;font-weight:bold;
}
.slotgroup h3 em{font-style:normal;font-weight:normal;color:var(--faint);
  font-size:10.5px;letter-spacing:.14em}
.slotrow{display:flex;align-items:center;gap:9px;margin:5px 0}
.slotrow .n{width:20px;color:var(--faint);font-size:11.5px;flex:none;text-align:right}
.slotrow select{flex:1;min-width:0;font-size:13px;padding:3px 2px}
.slotrow.filled select{color:var(--line)}
.slotrow .cost{width:96px;flex:none;text-align:right;font-size:11.5px;color:var(--dim);
  letter-spacing:.08em;white-space:nowrap}
.slotrow select.empty{color:var(--faint)}
.noslots{color:var(--faint);font-size:12px;letter-spacing:.16em;padding:2px 0}
.panel>h2 .acts{display:flex;gap:8px;margin-left:14px;flex:none}
.panel>h2 button{background:transparent;color:var(--faint);font:inherit;
  font-size:10.5px;letter-spacing:.18em;border:1px solid var(--rule);
  padding:2px 9px;cursor:pointer;border-radius:0}
.panel>h2 button:hover{color:var(--line);border-color:var(--line)}
.stocknote{margin-top:10px;font-size:10.5px;letter-spacing:.14em;color:var(--pen);
  opacity:.85;line-height:1.6}

/* --- ammo ---------------------------------------------------------------- */
/* One band of selectors, one per ammo type. It sits on one line wherever the
   column is wide enough and wraps rather than scrolling when it is not -- a
   control the reader cannot see is worse than a second line. */
.ammobar{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:14px;
  border-top:1px solid var(--rule);padding-top:13px}
.ammocell{flex:1 1 190px;min-width:0;display:flex;flex-direction:column;gap:3px}
.ammocell>span{font-size:10px;letter-spacing:.2em;color:var(--faint)}
.ammocell select{width:100%;background:transparent;color:var(--faint);
  font:inherit;font-size:12px;letter-spacing:.06em;border:0;
  border-bottom:1px solid var(--rule);padding:3px 0;border-radius:0;
  text-overflow:ellipsis}
.ammocell select:focus{outline:none;border-bottom-color:var(--line)}
/* Lit only for types the fit actually consumes; the rest stay legible but
   plainly inactive, so the row never reflows as weapons come and go. */
.ammocell.on>span{color:var(--dim)}
.ammocell.on select{color:var(--line);border-bottom-color:var(--rule)}
.ammofx{font-size:11px;letter-spacing:.08em;color:var(--dim);line-height:1.6}
.ammofx b{color:var(--line);font-weight:bold;margin-right:8px}
.wlist .salv{font-style:normal;color:var(--faint)}

/* --- meters ------------------------------------------------------------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;
  border-top:1px solid var(--rule);padding-top:13px}
.meter .lab{display:flex;justify-content:space-between;font-size:11.5px;
  letter-spacing:.2em;color:var(--dim);margin-bottom:5px}
.meter .lab b{color:var(--line);letter-spacing:.1em;font-size:14px}
.meter .bar{height:9px;border:1px solid var(--rule);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--shield);opacity:.75}
.meter.over .fill{background:var(--pen);opacity:.9}
.meter.over .lab b{color:var(--pen)}
.meter .free{font-size:10.5px;color:var(--faint);letter-spacing:.14em;margin-top:4px;
  display:block}

/* --- stats sheet -------------------------------------------------------- */
.stats{margin-top:22px}
.statsec{margin-bottom:16px}
.statsec>h3{
  margin:0 0 6px;font-size:11px;letter-spacing:.28em;color:var(--dim);
  font-weight:bold;border-bottom:1px solid var(--rule);padding-bottom:4px;
}
table.st{width:100%;border-collapse:collapse}
table.st td{padding:3px 0;vertical-align:baseline}
table.st td.k{color:var(--dim);font-size:12px;letter-spacing:.16em;
  white-space:nowrap;width:186px;padding-right:14px}
table.st td.v{font-size:14.5px;letter-spacing:.06em}
.v b{font-weight:bold;color:var(--line)}
.brk{color:var(--faint);font-size:12px;letter-spacing:.06em;margin-left:7px}
.pen{color:var(--pen)}
.plus{color:var(--shield)}
.cap{margin-left:10px;font-size:10.5px;letter-spacing:.14em;color:var(--pen);opacity:.9}
.nil{color:var(--faint)}

/* resistance strip */
.resgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
  border:1px solid var(--rule);background:var(--rule);margin-top:2px}
.rescell{background:var(--blue);padding:6px 4px;text-align:center}
.rescell .rt{font-size:10px;letter-spacing:.14em;color:var(--dim);display:block}
.rescell .rv{font-size:15px;font-weight:bold;display:block;margin-top:3px}
.rescell .rv.z{color:var(--faint);font-weight:normal}
.rescell.capped .rv{color:var(--pen)}
.rescell .rsub{display:block;margin-top:2px;font-size:9.5px;letter-spacing:.08em;
  color:var(--dim)}
.resnote{margin-top:5px;font-size:10.5px;letter-spacing:.16em;color:var(--pen);opacity:.85}
.rescell.adaptive .rv{font-style:italic}
.rescell.adaptive .rv::after{content:"a";font-size:9px;vertical-align:super;
  font-style:normal;opacity:.7;margin-left:1px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
.chip{border:1px solid var(--rule);padding:2.5px 8px;font-size:11.5px;
  letter-spacing:.12em;color:var(--line)}
.chip.src{color:var(--dim)}
.dt{padding:1.5px 7px;font-size:11.5px;letter-spacing:.1em;border:1px solid}
.dt-kinetic{color:#dfe5ee;border-color:#8c98a8}
.dt-thermal{color:#ffc9a3;border-color:#c2703c}
.dt-energy{color:#a8c9ff;border-color:#5b83d6}
.dt-em{color:#d3bcff;border-color:#8a6ad2}
.dt-explosive{color:#ffb3ac;border-color:#c9584f}
.dt-void{color:#c9c9ff;border-color:#7a72c9}
html[data-theme="light"] .dt-kinetic{color:#45526a;border-color:#8c98a8}
html[data-theme="light"] .dt-thermal{color:#a05018;border-color:#c2703c}
html[data-theme="light"] .dt-energy{color:#2f5fc0;border-color:#5b83d6}
html[data-theme="light"] .dt-em{color:#6a48b8;border-color:#8a6ad2}
html[data-theme="light"] .dt-explosive{color:#b03a31;border-color:#c9584f}
html[data-theme="light"] .dt-void{color:#5850b0;border-color:#7a72c9}

.wscroll{overflow-x:auto;margin-top:3px}
.wlist{width:100%;border-collapse:collapse;min-width:620px}
.wlist th{font-size:10px;letter-spacing:.18em;color:var(--faint);text-align:right;
  font-weight:normal;padding:0 0 4px 10px;border-bottom:1px solid var(--rule)}
.wlist th:first-child{text-align:left;padding-left:0}
.wlist td{font-size:12.5px;padding:3px 0 3px 10px;text-align:right;
  border-bottom:1px dotted var(--rule)}
.wlist td:first-child{text-align:left;padding-left:0;letter-spacing:.06em}
.wlist tr:last-child td{border-bottom:0}

/* --- title block -------------------------------------------------------- */
.titleblock{
  margin-top:16px;border:1px solid var(--line);display:grid;
  grid-template-columns:2.2fr 1fr 1fr 1fr 1.1fr;   /* replaced per render */
}
.tb{padding:8px 12px;border-right:1px solid var(--rule);min-width:0}
.tb:last-child{border-right:0}
.tb .tk{font-size:10px;letter-spacing:.2em;color:var(--dim);display:block}
.tb .tv{font-size:15px;letter-spacing:.1em;margin-top:3px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.big .tv{font-size:19.5px;font-weight:bold;letter-spacing:.18em}
.note{margin-top:10px;font-size:11px;color:var(--faint);letter-spacing:.14em;
  line-height:1.7}
.note b{color:var(--dim)}
.legacy-banner{margin:0 0 14px;padding:8px 14px;border:1px solid var(--pen);
  color:var(--pen);font-size:11.5px;letter-spacing:.18em;background:rgba(255,157,138,.07)}
.legacy-banner b{color:var(--line);font-weight:bold}
/* Discontinued modules stay in the dropdown so their numbers remain findable,
   but the game no longer lets them be installed, so the option is disabled.
   Native disabled options are already dimmed; this only keeps that legible
   against the cyanotype field, where the browser default is nearly invisible. */
.slotrow select option:disabled{color:var(--pen);opacity:.75}

.themebtn{
  position:absolute;top:12px;right:14px;z-index:3;
  background:transparent;color:var(--dim);font:inherit;font-size:11px;
  letter-spacing:.2em;border:1px solid var(--rule);padding:4px 10px;cursor:pointer;
}
.themebtn:hover{color:var(--line);border-color:var(--line)}

@media print{
  .themebtn{display:none}
  body{padding:0;background:var(--blue)}
  .sheet{max-width:none;border-width:2px}
  .brand .back{display:none}
  .body{grid-template-columns:42fr 58fr}
  select,input{border-bottom-color:var(--faint)}
}
</style>
</head>
<body>
<div class="sheet"><button id="themeBtn" class="themebtn" type="button"
  title="Cycle sheet style — blueprint / light / dark (remembered on this browser)">&#9681; BLUEPRINT</button><div class="inner">

  <header class="sheet-head">
    <div class="brand"><a href="./" class="back">&lsaquo; SHIPS</a>SHIP FITTING SHEET
      <small>SPACEMOLT FLEET REGISTRY &middot; OUTFITTING &amp; STATUS</small></div>
    <div class="controls">
      <label class="ctl"><span>SHIP</span><select id="ship"></select></label>
      <label class="ctl"><span>ENGINEERING LEVEL</span>
        <div class="engwrap">
          <input type="range" id="engRange" min="0" max="100" step="1" value="0">
          <input type="number" id="engNum" min="0" max="100" step="1" value="0">
          <span class="engnote" id="engNote"></span>
        </div>
      </label>
    </div>
  </header>

  <div class="legacy-banner" id="legacyBanner" hidden></div>

  <main class="body">
    <section class="panel plan">
      <h2><span>PLAN VIEW &middot; SHIELD ENVELOPE</span><em id="planScale"></em></h2>
      <div id="planWrap"></div>
      <div class="plan-legend">
        <span id="ringLegend"></span>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2><span>MODULE SLOTS</span>
          <em id="slotSummary"></em>
          <span class="acts"><button id="btnStock" type="button">STOCK</button
            ><button id="btnStrip" type="button">STRIP</button
            ><button id="btnExport" type="button"
              title="Download + copy a combat-sim fitting spec (cmd/combat-sim). Skills export as zeros — edit them to match your pilot.">EXPORT</button></span></h2>
        <div class="slotgrid" id="slots"></div>
        <div class="stocknote" id="stockNote"></div>
        <div class="ammobar" id="ammoBar"></div>
        <div class="meters">
          <div class="meter" id="mCpu">
            <div class="lab"><span>CPU</span><b></b></div>
            <div class="bar"><div class="fill"></div></div>
            <span class="free"></span>
          </div>
          <div class="meter" id="mPwr">
            <div class="lab"><span>POWER</span><b></b></div>
            <div class="bar"><div class="fill"></div></div>
            <span class="free"></span>
          </div>
        </div>
      </div>

      <div class="panel stats">
        <h2><span>COMBINED STATUS</span><em>BASE + FITTED MODULES</em></h2>
        <div id="stats"></div>
      </div>
    </section>
  </main>

  <footer class="titleblock" id="titleblock"></footer>
  <div class="note" id="footnote"></div>

</div></div>

<script>
"use strict";
const SHIPS = /*__SHIPS__*/null;
const MODULES = /*__MODULES__*/null;
const DTYPES = /*__DAMAGE_TYPES__*/null;
const AMMO = /*__AMMO__*/null;      // ammo type -> rounds, alphabetical by name

/* Trace geometry in CSS pixels, converted to panel units at draw time. The
   panel viewBox is a fixed 800 wide but renders at whatever width the column
   gives it (~500px), so a constant expressed in user units renders at an
   arbitrary size -- at 500px a 1.3-unit stroke lands on 0.8 CSS px, thinner
   than a pixel, and the traces smear into the hull outline. Pixel constants
   render the same everywhere. HULL_W_PX likewise: the hull path lives inside
   the ship-fit scale, so a fixed stroke-width there draws fat on small hulls
   and thin on large ones. */
const RING_GAP_PX = 5, RING_W_PX = 1.6, HULL_W_PX = 2.2;
/* Share of the panel the drawing may occupy -- hull plus its shield envelope,
   whichever axis binds first. */
const PLAN_FILL = 0.90;
/* The panel's height follows the hull rather than being fixed. Rotated upright
   a median ship is 2.05 tall per unit wide, but a fixed 800x1080 box is only
   1.35, so height bound the fit first and the drawing used barely half the
   width. Capped so the few very elongated hulls (up to 3.98) cannot produce an
   absurd panel; those fit by height instead. Either way the envelope is
   budgeted on BOTH axes first, so shield traces never clip. */
const PLAN_MAX_ASPECT = 2.9;
/* Speed stops at 6 however many afterburners are bolted on. Worth showing
   rather than silently clamping: a Plasma Afterburner alone is +4 and 316 of
   the 338 hulls can reach the cap, so the sheet would otherwise promise speed
   that does not exist and hide the wasted slots. */
const SPEED_CAP = 6;
const PANEL_W = 800;

const BY_SLOT = {weapon:[], defense:[], utility:[]};
for (const m of MODULES) (BY_SLOT[m.slot] ||= []).push(m);
const MOD = Object.fromEntries(MODULES.map(m => [m.id, m]));

/* Ammo. Rounds arrive from the generator already sorted by name, so AMMO[t][0]
   is the alphabetically first round of a type -- what a newly fitted weapon of
   that type loads. Only damage_mod moves the offense numbers; every other
   modifier a round carries is conditional (only against armour, only over time)
   and shows as a labelled effect instead. */
const AMMO_TYPES = Object.keys(AMMO).sort();
/* Names of modules the devs deleted outright rather than merely withdrew. */
const GONE = new Set(MODULES.filter(m => m.gone).map(m => m.name));
const ROUND = {};
for (const [t, list] of Object.entries(AMMO))
  for (const a of list) ROUND[a.id] = Object.assign({type: t}, a);

/* Ammo types the current fit actually consumes. The Scrapgun's `junk` type has
   no catalogued rounds -- it feeds on salvage in the hold -- so it never gets a
   selector, and AMMO[t] guards that here. */
function ammoTypesInUse() {
  const out = new Set();
  for (const slot of ["weapon", "defense", "utility"])
    for (const id of state.fit[slot]) {
      const m = id && MOD[id];
      if (m && m.w && m.w.ammo && AMMO[m.w.ammo]) out.add(m.w.ammo);
    }
  return out;
}

/* Fitting a weapon loads its type's default round. A type the user cleared
   holds "" rather than undefined, so clearing sticks instead of refilling on
   the next render. */
function autoloadAmmo() {
  for (const t of ammoTypesInUse())
    if (state.ammo[t] === undefined && (AMMO[t] || []).length)
      state.ammo[t] = AMMO[t][0].id;
}

/* The round loaded for a weapon, or null when its type has none chosen. */
function roundFor(w) {
  return (w && w.ammo && ROUND[state.ammo[w.ammo]]) || null;
}

/* The catalog ships most hulls with modules already in them, so the sheet opens
   on the stock loadout rather than a stripped hull. Each id claims the next free
   slot of its own type; ids the module catalog does not carry are reported
   rather than dropped. Nothing in the fleet ships more stock than it has slots. */
function stockFit(s) {
  const fit = {weapon:[], defense:[], utility:[]};
  const cap = {weapon:s.w||0, defense:s.d||0, utility:s.u||0};
  const missing = [], overflow = [], retired = [];
  for (const id of s.dm || []) {
    const m = MOD[id];
    if (!m) { missing.push(id); continue; }
    // 21 hulls still name a discontinued module in their catalog loadout.
    // v0.561.0 unfitted those in-game, so the stock fit here drops them too --
    // otherwise the sheet would quote stats no live ship can actually reach.
    if (m.legacy) { retired.push(m.name); continue; }
    if (fit[m.slot].length < cap[m.slot]) fit[m.slot].push(id);
    else overflow.push(m.name);
  }
  return {fit, missing, overflow, retired};
}

const state = {
  ship: SHIPS.annihilator ? "annihilator" : Object.keys(SHIPS)[0],
  eng: 0,
  fit: {weapon:[], defense:[], utility:[]},
  stock: {missing:[], overflow:[], retired:[]},
  ammo: {},          // ammo type -> round id; "" means deliberately cleared
};

function loadStock() {
  const r = stockFit(SHIPS[state.ship]);
  state.fit = r.fit;
  state.stock = {missing:r.missing, overflow:r.overflow, retired:r.retired};
}

/* Ship record keys for the three slot counts, and the URL's slot prefixes. */
const SLOT_KEY = {weapon:"w", defense:"d", utility:"u"};
const SLOT_PREFIX = {weapon:"w", defense:"d", utility:"u"};
const PREFIX_SLOT = {w:"weapon", d:"defense", u:"utility"};

/* ------------------------------------------------------------- URL state */
/* Shareable links, same contract as the BoM explorer: slot params are
   `<type><1-based index>=<item id>`, e.g. w1=autocannon_ii&u1=cargo_expander_iii.
   Ship and module ids are [a-z0-9_] throughout the catalog, so nothing is run
   through encodeURIComponent -- it would only make the URL unreadable.

   Slot params are authoritative: any slot the URL does not name is empty. A
   fit that is exactly the stock loadout emits no slot params at all, so the
   common link stays just ?ship=<id>; `stock=0` marks a hand-built fit on a
   hull that ships with modules, which a bare ?ship= would otherwise restore. */
function encodeState() {
  const s = SHIPS[state.ship], parts = ["ship=" + state.ship];
  if (state.eng) parts.push("eng=" + state.eng);
  if (!isStock()) {
    if ((s.dm || []).length) parts.push("stock=0");
    for (const [slot, pre] of Object.entries(SLOT_PREFIX))
      for (let i = 0; i < (s[SLOT_KEY[slot]] || 0); i++)
        if (state.fit[slot][i]) parts.push(`${pre}${i+1}=${state.fit[slot][i]}`);
  }
  // Ammo rides along only where it differs from what a fresh load of this fit
  // would produce -- the default round for a type in use, nothing for a type
  // that is not -- so the common link stays short. `none` marks a type the user
  // deliberately emptied, which a bare link would otherwise refill.
  const inUse = ammoTypesInUse();
  for (const t of AMMO_TYPES) {
    const cur = state.ammo[t];
    if (cur === undefined) continue;
    const dflt = inUse.has(t) ? (AMMO[t][0] || {}).id : undefined;
    if (cur === dflt) continue;
    if (!cur && !inUse.has(t)) continue;
    parts.push(`am_${t}=${cur || "none"}`);
  }
  return parts.join("&");
}

/* URLs are user-editable, so a bad one must degrade rather than break the
   page: unknown ships, out-of-range slots, unknown module ids and modules of
   the wrong type for their slot are all dropped in favour of the defaults. */
function decodeState(query) {
  const p = new URLSearchParams(query || "");

  const ship = p.get("ship");
  if (ship && SHIPS[ship]) state.ship = ship;
  const s = SHIPS[state.ship];

  if (p.has("eng")) {
    const n = Math.round(+p.get("eng"));
    state.eng = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
  }

  const fit = {weapon:[], defense:[], utility:[]};
  const retired = [];
  let explicit = p.get("stock") === "0";
  for (const [k, v] of p) {
    const m = /^([wdu])([0-9]{1,2})$/.exec(k);
    if (!m) continue;
    const slot = PREFIX_SLOT[m[1]], i = +m[2] - 1;
    if (i < 0 || i >= (s[SLOT_KEY[slot]] || 0)) continue;   // hull has no such slot
    explicit = true;                 // a named slot means the link is hand-built,
    const mod = MOD[v];              // even if this particular id turns out bad
    if (!mod || mod.slot !== slot) continue;
    // Links shared before v0.561.0 can name modules that can no longer be
    // installed. Drop them rather than quoting a fit the game will not allow,
    // and name them so the link still explains itself.
    if (mod.legacy) { retired.push(mod.name); continue; }
    fit[slot][i] = v;
  }
  if (explicit) { state.fit = fit; state.stock = {missing:[], overflow:[], retired}; }
  else loadStock();

  // Ammo params name a type, not a slot, so they are independent of the fit;
  // an unknown round or one of the wrong type is dropped like any other bad id.
  for (const t of AMMO_TYPES) {
    const v = p.get("am_" + t);
    if (v === null) continue;
    if (v === "none" || v === "") state.ammo[t] = "";
    else if (ROUND[v] && ROUND[v].type === t) state.ammo[t] = v;
  }
}

/* True while every slot still holds exactly what the catalog put there. */
function isStock() {
  const s = SHIPS[state.ship], r = stockFit(s);
  return Object.entries(SLOT_KEY).every(([slot, key]) => {
    for (let i = 0; i < (s[key]||0); i++)
      if ((state.fit[slot][i]||"") !== (r.fit[slot][i]||"")) return false;
    return true;
  });
}
let planCache = {};   // ship id -> {vb:[w,h], d:path} | null when no plan on file

/* ----------------------------------------------------------------- helpers */
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => {
  const r = Math.round(n * 100) / 100;
  return (Math.abs(r) >= 1000 ? r.toLocaleString("en-US") : String(r));
};
const titleCase = s => s.replace(/_/g," ").replace(/^./, c => c.toUpperCase());
/* "20260712" -> "2026-07-12"; the sidecar stores snapshot directory names. */
const fmtSnap = d => /^\d{8}$/.test(d) ? d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6) : d;

/* An accumulator per stat: base value plus everything modules added or took
   away, kept apart so the sheet can show `550 (450+100)` rather than just 550. */
const acc = base => ({base: base||0, add: 0, sub: 0});
const total = a => a.base + a.add - a.sub;

/* Render one value: bold total when modified, breakdown after it, penalty red. */
function val(a, unit, opts={}) {
  const u = unit ? `<span class="brk">${esc(unit)}</span>` : "";
  const t = total(a);
  if (!a.add && !a.sub)
    return `<span class="${t?'':'nil'}">${num(t)}</span>${u}`;
  let brk = num(a.base);
  if (a.add) brk += ` <span class="plus">+${num(a.add)}</span>`;
  if (a.sub) brk += ` <span class="pen">&minus;${num(a.sub)}</span>`;
  return `<b>${num(t)}</b>${u}<span class="brk">(${brk})</span>`;
}

/* ------------------------------------------------------------- computation */
/* Engineering is "1% per level" CPU and power efficiency. Both halves of this
   are MEASURED against get_ship, 2026-09-05/06, not inferred from the skill text:

     - the SHIP TOTAL sums raw module costs and rounds once at the end.
       4x Cargo Expander I (4 CPU raw) at Engineering 30 -> cpu_used 3, i.e.
       round(4 x 0.70); not 4x round(0.7) = 4, not floor(2.8) = 2.
     - each MODULE is discounted and rounded on its own. At Engineering 67 the
       server reports Quantum Shield IV (12 CPU raw) as cpu_usage 4 = round(3.96),
       Null Cannon (15) as 5, Energy Siphon (12) as 4.

   So per-slot figures legitimately do NOT sum to the total -- 4+4+5+0 = 13
   against a 13 total there, but 1+1+1+1 = 4 against a total of 3 on the
   Enterprise. That is the server's own behaviour and the sheet mirrors it
   rather than papering over it. Level 100 zeroes every module. */
const engMul = () => 1 - state.eng / 100;
const modCpu = m => Math.round(m.cpu * engMul());
const modPwr = m => Math.round(m.pwr * engMul());

/* ------------------------------------------------------------ sheet themes */
const THEMES = ["blueprint", "light", "dark"];
let theme = "blueprint";
function applyTheme(t) {
  theme = THEMES.includes(t) ? t : "blueprint";
  if (theme === "blueprint") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  const b = document.getElementById("themeBtn");
  if (b) b.innerHTML = "&#9681; " + theme.toUpperCase();
  try { localStorage.setItem("fitting-theme", theme); } catch (e) {}
}
try { applyTheme(localStorage.getItem("fitting-theme") || "blueprint"); }
catch (e) { applyTheme("blueprint"); }
/* flood-color in the shield-ring filters cannot use var(); resolve live. */
const themeToken = name =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function fittedModules() {
  const out = [];
  for (const slot of ["weapon","defense","utility"])
    for (const id of state.fit[slot]) if (id && MOD[id]) out.push(MOD[id]);
  return out;
}

function compute() {
  const s = SHIPS[state.ship], fitted = fittedModules();
  const r = {
    ship: s, fitted,
    cpuCap: acc(s.cpu), pwrCap: acc(s.pwr), cpuUsed: 0, pwrUsed: 0,
    cpuRaw: 0, pwrRaw: 0,
    hull: acc(s.hull), armor: acc(s.armor), shield: acc(s.shield),
    srec: acc(s.srec), arep: acc(0),
    speed: acc(s.speed), fuel: acc(s.fuel), cargo: acc(s.cargo),
    feff: acc(0), tow: acc(s.tow),
    cloak: acc(0), scan: acc(0), acc_: acc(0), track: acc(0), sig: acc(0),
    dbw: acc(0), dcap: acc(0), hpow: acc(0), hrng: acc(0),
    spow: acc(0), srng: acc(0),
    res: Object.fromEntries(DTYPES.map(d => [d, {typed:0}])),
    adaptive: false,
    // Pools the module text describes as "add and cap at 75%".
    flat: 0, react: 0, dodge: 0, reflect: 0, amis: 0, web: 0,
    dpt: 0, edptLo: 0, edptHi: 0, reach: 0, alpha: 0,
    byType: {}, weapons: [],
    rounds: new Map(),   // round id -> round, for the loaded-ammo effects row
    ammoPending: 0,      // fitted weapons whose type has no round chosen
    features: new Map(), reqs: {},
  };

  // Ship-inherent capabilities (berths, scan resistance, ...) ride along as
  // named rows rather than being folded into a numeric stat.
  r.inherent = (s.caps || []).map(([t, v]) => [titleCase(t), v]);

  for (const m of fitted) {
    r.cpuRaw += m.cpu;
    r.pwrRaw += m.pwr;
    for (const sp of m.sp || []) r.features.set(sp, (r.features.get(sp)||new Set()).add(m.name));
    for (const [k, lv] of Object.entries(m.req || {}))
      r.reqs[k] = Math.max(r.reqs[k] || 0, lv);

    const d = m.d;
    if (d) {
      r.shield.add += d.shield||0;  r.srec.add += d.srec||0;
      r.armor.add  += d.armor||0;   r.arep.add += d.arep||0;
      r.hull.add   += d.hull||0;
      // An adaptive module states its reduction TWICE -- once as the
      // adaptive_resistance_N token and again as damage_reduction -- and the
      // catalog text confirms they are one number ("35% flat/adaptive damage
      // reduction"). Take the larger of the two, never the sum.
      const dr = d.dred || 0;
      r.flat += Math.max(dr * (dr <= 1 ? 100 : 1), m.adapt || 0);
      r.cloak.add = Math.max(r.cloak.add, d.cloak||0);   // a rating, not a pool
      // Typed and flat/adaptive are SEPARATE buckets (v0.564.1), so an adaptive
      // module is no longer shadowed by a hardener covering the same type -- the
      // two multiply. See resStages().
      for (const dt of DTYPES) {
        const explicit = (d.res||{})[dt] || 0;
        if (explicit) r.res[dt].typed += explicit * (explicit <= 1 ? 100 : 1);
      }
      if (m.adapt) r.adaptive = true;
      // "Typed and reactive module resistances add and cap at 75%" -- reactive
      // answers whichever type is incoming, so it joins the typed bucket on
      // every one of them rather than forming a pool of its own.
      r.react += d.react || 0;
      r.dodge += d.dodge || 0;
      r.reflect += d.reflect || 0;
      r.amis += d.amis || 0;
    }
    const u = m.u;
    if (u) {
      r.speed.add += u.speed||0;   r.speed.sub += u.speedpen||0;
      r.cargo.add += u.cargo||0;   r.hull.sub  += u.hullpen||0;
      r.cpuCap.add += u.cpub||0;   r.fuel.add  += u.mfuel||0;
      r.feff.add += Math.max(0, u.feff||0);
      r.feff.sub += Math.max(0, -(u.feff||0));
      r.tow.sub += u.towpen||0;
      r.cloak.add = Math.max(r.cloak.add, u.cloak||0);
      r.scan.add += u.scan||0;   r.acc_.add += u.acc||0;
      r.track.add += u.track||0; r.sig.add += u.sig||0;
      r.dbw.add += u.dbw||0;     r.dcap.add += u.dcap||0;
      r.hpow.add += u.hpow||0;   r.hrng.add = Math.max(r.hrng.add, u.hrng||0);
      r.spow.add += u.spow||0;   r.srng.add = Math.max(r.srng.add, u.srng||0);
      r.web += u.web||0;
    }
    const w = m.w;
    if (w) {
      // A loaded round pins effective DPT to one figure. With none chosen, the
      // span across every round that fits is all the sheet can honestly show.
      const a = roundFor(w), mul = 1 + (a ? a.dm : 0);
      const dpt = w.dpt || 0, eff = dpt * mul, span = w.edpt || [dpt, dpt];
      r.dpt += dpt;
      r.edptLo += a ? eff : span[0];
      r.edptHi += a ? eff : span[1];
      r.reach = Math.max(r.reach, w.reach||w.rng||0);
      r.alpha += (w.dmg||0) * mul;
      r.byType[w.dt] = (r.byType[w.dt]||0) + (a ? eff : dpt);
      if (a) r.rounds.set(a.id, a);
      else if (w.ammo && AMMO[w.ammo]) r.ammoPending++;
      r.weapons.push(m);
    }
  }
  r.cpuUsed = Math.round(r.cpuRaw * engMul());
  r.pwrUsed = Math.round(r.pwrRaw * engMul());
  return r;
}

/* --------------------------------------------------------------- ring math */
/* Damage resistance, per the stacking rule the devs documented in v0.564.1: the
   server applies shield skill, then TYPED resistance, then FLAT/ADAPTIVE
   resistance, truncating to an integer at each stage. Bonuses ADD inside a
   bucket and each bucket stops at 75%, so the two buckets compose
   multiplicatively -- a fit can read past 75% overall yet never reaches
   immunity. Shield skill is a pilot skill and is left out here like every other
   skill on this sheet. Truncation is per-stage on the damage integer, so the
   percentages below are exact for the buckets and a hair optimistic for the
   final figure. */
const RES_CAP = 75;

/* Every pool the module descriptions call "add and cap at 75%" reads the same
   way, so they all render through one shape: the raw sum, the capped value, and
   whether the cap threw anything away. */
function pool(raw) {
  return {raw, val: Math.min(RES_CAP, raw), capped: raw > RES_CAP};
}

function resStages(r) {
  const flatRaw = r.flat;
  const flat = Math.min(RES_CAP, flatRaw);
  return DTYPES.map(dt => {
    const typedRaw = r.res[dt].typed + r.react,
          typed = Math.min(RES_CAP, typedRaw);
    return {dt, typedRaw, typed, flatRaw, flat,
            eff: 100 - (100 - typed) * (100 - flat) / 100};
  });
}

/* Resistances land on quarter-percents once two buckets multiply, so show a
   decimal only when there is one. */
function pct(v) {
  return (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v))
                                             : v.toFixed(2).replace(/0$/, "")) + "%";
}

/* Multiplier a fit applies to shield capacity. No module in the catalog reduces
   shields by a percentage, so this is always 1 today; the trimmed-trace path it
   feeds is kept for when one appears. */
function shieldPenalty(r) {
  return 1;
}

/* Traces = 2 baseline + 1 per tier above 1, scaled by how far the fit moves
   shields off the hull's own number. Doubling shields doubles the traces. */
function ringPlan(r) {
  const s = r.ship;
  const baseRings = 2 + Math.max(0, (s.tier || 0) - 1);
  const base = s.shield || 0, nominal = total(r.shield);
  const pct = shieldPenalty(r);
  const effective = nominal * pct;
  const ringsFor = v => base > 0 ? Math.max(0, Math.round(baseRings * v / base))
                                 : (v > 0 ? baseRings : 0);
  const nom = ringsFor(nominal), eff = ringsFor(effective);
  return {baseRings, nom, eff, shown: Math.max(nom, eff), lost: Math.max(0, nom - eff),
          base, nominal, effective, pct};
}

/* Stand-in silhouette for the hulls with no surveyed plan, in the same
   landscape, nose-at-+x convention as the real ones so it scales identically. */
function placeholderPlan() {
  const W = 1000, H = 420, c = H / 2;
  return {w: W, h: H, placeholder: true, d:
    `M ${W} ${c}`
    + ` C ${W*.88} ${c-H*.26} ${W*.60} ${c-H*.46} ${W*.30} ${c-H*.48}`
    + ` L ${W*.07} ${c-H*.40} L 0 ${c-H*.22} L 0 ${c+H*.22}`
    + ` L ${W*.07} ${c+H*.40} L ${W*.30} ${c+H*.48}`
    + ` C ${W*.60} ${c+H*.46} ${W*.88} ${c+H*.26} ${W} ${c} Z`};
}

/* ------------------------------------------------------------ plan drawing */
async function loadPlan(id) {
  if (id in planCache) return planCache[id];
  if (!SHIPS[id].plan) return (planCache[id] = null);
  try {
    const txt = await (await fetch(`plans/${id}.svg`)).text();
    const vb = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(txt);
    const d = /<path d="([^"]+)"/.exec(txt);
    planCache[id] = (vb && d) ? {w:+vb[1], h:+vb[2], d:d[1]} : null;
  } catch { planCache[id] = null; }
  return planCache[id];
}

function drawPlan(plan, rp) {
  const rings = rp.shown;
  // Panel units per CSS pixel, from the width the column actually gave us.
  const u = PANEL_W / (el("planWrap").clientWidth || 520);
  const gap = RING_GAP_PX * u, ringW = RING_W_PX * u, hullW = HULL_W_PX * u;

  // The envelope grows outward from the hull, so the traces claim their width
  // first and the hull is fitted into what is left of the 90% budget.
  const surveyed = !!plan;
  plan = plan || placeholderPlan();
  const capH = 46, topM = 26, ringOut = rings * gap;

  // Claim the width budget for hull-plus-envelope, then let the panel grow as
  // tall as that scale needs. The envelope is subtracted on both axes, so the
  // outermost trace is always inside the panel however skinny the hull is.
  const availW = PLAN_FILL * PANEL_W - ringOut*2;

  // Source silhouettes are landscape with the nose at +x, so rotate(-90) stands
  // the ship up nose-to-top; translate(0,w) brings it back on-canvas. Rotated,
  // the plan's beam runs across x and its length down y.
  let S = Math.max(0.0001, availW / plan.h);
  let H = plan.w * S + ringOut*2 + capH + topM;
  const maxH = PANEL_W * PLAN_MAX_ASPECT;
  if (H > maxH) {                    // too long to draw at the full width
    H = maxH;
    S = Math.max(0.0001, (H - ringOut*2 - capH - topM) / plan.w);
  }
  const tx = PANEL_W/2 - plan.h*S/2, ty = (H - capH)/2 - plan.w*S/2;
  const g = inner =>
    `<g transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${S.toFixed(5)}) translate(0 ${plan.w}) rotate(-90)">${inner}</g>`;
  // stroke-width is divided by the fit scale so it lands on HULL_W_PX
  const dash = surveyed ? ""
    : ` stroke-dasharray="${(hullW*3/S).toFixed(2)} ${(hullW*2.6/S).toFixed(2)}"`;
  const body = {
    shape: g(`<path d="${plan.d}" fill="#fff"/>`),
    hull:  g(`<path d="${plan.d}" class="hull" stroke-width="${(hullW/S).toFixed(3)}"${dash}/>`)};

  const sh = SHIPS[state.ship];
  const cap = !surveyed ? "PLAN VIEW PENDING SURVEY"
    : sh.loa ? `L.O.A. ${sh.loa} M × BEAM ${sh.beam} M`
             : `DIMENSIONS PENDING SURVEY · ${plan.w}×${plan.h} UNITS`;

  // One offset outline per trace. feMorphology dilates the filled silhouette
  // twice and subtracts, which follows the hull shape instead of scaling it.
  const dp = (7 * u).toFixed(2), dl = (4 * u).toFixed(2);
  let defs = `<pattern id="dashpat" width="${dp}" height="${dp}" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="${dp}" height="${dp}" fill="#000"/><rect width="${dl}" height="${dp}" fill="#fff"/></pattern>
    <mask id="dashmask" maskUnits="userSpaceOnUse" x="0" y="0" width="${PANEL_W}" height="${H}">
      <rect width="${PANEL_W}" height="${H}" fill="url(#dashpat)"/></mask>`;
  let layers = "";
  for (let i = 1; i <= rings; i++) {
    const lost = i > rp.eff;                   // trimmed by a shield penalty
    const R = gap*i + ringW/2, Ri = Math.max(0.01, gap*i - ringW/2);
    const col = lost ? themeToken("--shield-lost") : themeToken("--shield");
    const op  = lost ? 0.5 : (0.95 - (i-1)/Math.max(rings,1)*0.45).toFixed(3);
    defs += `<filter id="rg${i}" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="${R.toFixed(2)}" result="o"/>
        <feMorphology in="SourceAlpha" operator="dilate" radius="${Ri.toFixed(2)}" result="n"/>
        <feComposite in="o" in2="n" operator="out" result="ring"/>
        <feFlood flood-color="${col}" flood-opacity="${op}"/>
        <feComposite in2="ring" operator="in"/></filter>`;
    layers += `<g filter="url(#rg${i})"${lost ? ' mask="url(#dashmask)"' : ''}>${body.shape}</g>`;
  }

  return `<svg viewBox="0 0 ${PANEL_W} ${H.toFixed(0)}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Plan view with shield envelope">
    <defs>${defs}</defs>
    <style>
      .hull{fill:var(--line);fill-opacity:.10;stroke:var(--line);stroke-linejoin:round}
      .cl{stroke:var(--line);stroke-width:.8;stroke-dasharray:22 5 3 5;stroke-opacity:.55}
      .plabel{font:11.5px 'Courier New',monospace;fill:var(--line);letter-spacing:.18em;opacity:.8}
    </style>
    <line x1="${PANEL_W/2}" y1="18" x2="${PANEL_W/2}" y2="${(H-capH+8).toFixed(0)}" class="cl"/>
    ${layers}
    ${body.hull}
    <text class="plabel" x="${PANEL_W/2}" y="${(H-14).toFixed(0)}" text-anchor="middle">${esc(cap)}</text>
    <text class="plabel" x="${PANEL_W/2}" y="16" text-anchor="middle">FWD &#9650;</text>
  </svg>`;
}

/* ---------------------------------------------------------------- rendering */
function optionsFor(slot) {
  return `<option value="">&mdash; empty &mdash;</option>` + BY_SLOT[slot].map(m => {
    let tail = `${m.cpu}c/${m.pwr}p`;
    if (m.w) tail += ` · ${num(m.w.dpt)} DPT`;
    else if (m.d && m.d.shield) tail += ` · +${m.d.shield} shd`;
    else if (m.d && m.d.armor) tail += ` · +${m.d.armor} arm`;
    else if (m.u && m.u.cargo) tail += ` · +${m.u.cargo} cargo`;
    if (m.gone) tail += " · REMOVED FROM GAME";
    else if (m.legacy) tail += " · DISCONTINUED";
    // v0.561.0 unfitted these and blocked refitting: they stay listed so the
    // module and its numbers remain visible, but they cannot be installed.
    return `<option value="${esc(m.id)}"${m.legacy ? " disabled" : ""}>` +
           `${esc(m.name)} — ${tail}</option>`;
  }).join("");
}

/* One selector per ammo type, always all of them, so the row does not reflow as
   weapons come and go. Types the fit consumes are lit; the rest stay dim and
   empty. A weapon's damage is not per-weapon ammo in this sheet -- every weapon
   of a type shares the type's round, which is how the row stays one line. */
function renderAmmoBar() {
  const inUse = ammoTypesInUse();
  el("ammoBar").innerHTML = AMMO_TYPES.map(t => {
    const cur = state.ammo[t] || "";
    const opts = `<option value="">&mdash; none &mdash;</option>` +
      AMMO[t].map(a => `<option value="${esc(a.id)}"${a.id === cur ? " selected" : ""}>` +
        `${esc(a.name)}${a.dm ? ` (${a.dm > 0 ? "+" : ""}${Math.round(a.dm * 100)}%)` : ""}` +
        `</option>`).join("");
    return `<label class="ammocell${inUse.has(t) ? " on" : ""}">
      <span>${esc(titleCase(t))}</span>
      <select data-ammo="${esc(t)}">${opts}</select></label>`;
  }).join("");
  el("ammoBar").querySelectorAll("select").forEach(sel => {
    sel.onchange = () => {
      // "" is a real value here, not absence: it means cleared on purpose, so
      // autoloadAmmo leaves it alone.
      state.ammo[sel.dataset.ammo] = sel.value;
      render();
    };
  });
}

function renderSlots() {
  const s = SHIPS[state.ship];
  const groups = [["weapon","WEAPON",s.w||0],["defense","DEFENSE",s.d||0],
                  ["utility","UTILITY",s.u||0]];
  const fitted = ["weapon","defense","utility"]
    .reduce((n, sl) => n + state.fit[sl].filter(Boolean).length, 0);
  el("slotSummary").textContent =
    `${s.w||0}W / ${s.d||0}D / ${s.u||0}U` +
    (!(s.dm||[]).length ? " · NO STOCK LOADOUT"
      : isStock() ? " · STOCK" : " · MODIFIED");

  const notes = [];
  if (state.stock.missing.length)
    notes.push(`STOCK LOADOUT NAMES ${state.stock.missing.length} MODULE` +
      `${state.stock.missing.length>1?"S":""} THE CATALOG DOES NOT CARRY: ` +
      state.stock.missing.map(id => esc(titleCase(id))).join(", "));
  if (state.stock.overflow.length)
    notes.push(`MORE STOCK MODULES THAN SLOTS — NOT FITTED: ` +
      state.stock.overflow.map(esc).join(", "));
  // Two different fates share the dropdown: withdrawn from sale but still
  // fittable-in-principle, versus deleted from the game outright.
  const retired = [...new Set(state.stock.retired || [])];
  if (retired.length) {
    const gone = retired.filter(n => GONE.has(n));
    const held = retired.filter(n => !GONE.has(n));
    if (held.length)
      notes.push(`DISCONTINUED — NOT IN THE CATALOG AND NOT FITTABLE: ` +
        held.map(esc).join(", "));
    if (gone.length)
      notes.push(`REMOVED FROM THE GAME — HOLDINGS REFUNDED: ` +
        gone.map(esc).join(", "));
  }
  el("stockNote").innerHTML = notes.join("<br>");
  el("slots").innerHTML = groups.map(([slot,label,n]) => {
    if (!n) return `<div class="slotgroup"><h3>${label}<em>none</em></h3>
      <div class="noslots">NO ${label} SLOTS ON THIS HULL</div></div>`;
    const rows = Array.from({length:n}, (_,i) => {
      const cur = state.fit[slot][i] || "";
      const m = cur ? MOD[cur] : null;
      /* Engineering-discounted and rounded per module, which is exactly what
         get_ship reports on each fitted module instance. These rows do not
         have to sum to the ship total -- the server rounds per module here
         and rounds the raw sum separately for the total. See engMul above. */
      const cost = m ? `${modCpu(m)}c &middot; ${modPwr(m)}p` : "&mdash;";
      return `<div class="slotrow${m?' filled':''}">
        <span class="n">${i+1}</span>
        <select class="${m?'':'empty'}" data-slot="${slot}" data-i="${i}">${optionsFor(slot)}</select>
        <span class="cost">${cost}</span></div>`;
    }).join("");
    return `<div class="slotgroup"><h3>${label}<em>${n} slot${n>1?"s":""} · ${BY_SLOT[slot].length} fittable</em></h3>${rows}</div>`;
  }).join("");
  // Set values after injection so long option lists stay in the DOM once.
  el("slots").querySelectorAll("select").forEach(sel => {
    sel.value = state.fit[sel.dataset.slot][+sel.dataset.i] || "";
    sel.onchange = () => {
      state.fit[sel.dataset.slot][+sel.dataset.i] = sel.value;
      render();
    };
  });
}

function meter(id, used, cap) {
  const box = el(id), over = used > cap;
  box.classList.toggle("over", over);
  box.querySelector("b").textContent = `${num(used)} / ${num(cap)}`;
  box.querySelector(".fill").style.width =
    `${cap > 0 ? Math.min(100, used/cap*100) : (used?100:0)}%`;
  box.querySelector(".free").textContent = over
    ? `OVER BY ${num(used-cap)}`
    : `${num(cap-used)} FREE`;
}

function row(k, v) { return `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`; }
function section(title, body) {
  return body ? `<div class="statsec"><h3>${title}</h3>${body}</div>` : "";
}
function tbl(rows) { return rows ? `<table class="st">${rows}</table>` : ""; }

function renderStats(r) {
  const s = r.ship;
  const out = [];

  // One row per "add and cap at 75%" pool, reporting what the cap threw away the
  // same way the speed cap does.
  const capRow = (label, raw, unit, gloss) => {
    if (!raw) return "";
    const p = pool(raw);
    return row(label, `${num(p.val)}${unit}`
      + `<span class="brk">${gloss}</span>`
      + (p.capped ? `<span class="cap">${num(raw)}${unit} CAPPED AT ${RES_CAP}${unit}</span>` : ""));
  };

  // -- defense ------------------------------------------------------------
  const ehp = total(r.hull) + total(r.armor) + total(r.shield);
  let def = row("SHIELD", val(r.shield))
          + row("SHIELD RECHARGE", val(r.srec, " /tick"))
          + row("ARMOR", val(r.armor))
          + row("ARMOR REPAIR", val(r.arep, " /tick"))
          + row("HULL", val(r.hull))
          + row("EFFECTIVE HP", `<b>${num(ehp)}</b><span class="brk">shield + armor + hull</span>`);
  const stages = resStages(r);
  const resCells = stages.map(c => {
    const capped = c.typedRaw > c.typed || c.flatRaw > c.flat;
    const both = c.typed && c.flat;
    return `<div class="rescell${r.adaptive && c.flat ? " adaptive" : ""}${capped ? " capped" : ""}">
      <span class="rt">${c.dt.toUpperCase()}</span>
      <span class="rv${c.eff ? "" : " z"}">${c.eff ? pct(c.eff) : "—"}</span>
      ${both ? `<span class="rsub">${num(c.typed)} × ${num(c.flat)}</span>` : ""}</div>`;
  }).join("");
  // Wasted resistance is reported the way wasted speed is: name the bucket that
  // overflowed rather than silently clipping it.
  const capMsgs = [];
  if (stages[0].flatRaw > stages[0].flat)
    capMsgs.push(`FLAT/ADAPTIVE ${num(stages[0].flatRaw)}% CAPPED AT ${RES_CAP}%`);
  const overTyped = stages.filter(c => c.typedRaw > c.typed);
  if (overTyped.length)
    capMsgs.push(overTyped.map(c => `${c.dt.toUpperCase()} ${num(c.typedRaw)}%`).join(", ")
                 + ` CAPPED AT ${RES_CAP}%`);
  const resNote = capMsgs.length
    ? `<div class="resnote">${capMsgs.join(" · ")}</div>` : "";

  // The other pools the module text caps at 75%. Each is its own damage stage,
  // so they are listed rather than folded into the resistance figures.
  const pools = capRow("FLAT / ADAPTIVE", r.flat, "%",
                       "second damage stage, after typed resistance")
              + capRow("PHASE DODGE", r.dodge, "%", "enemy hit chance")
              + capRow("ENERGY REFLECT", r.reflect, "%", "returned to the attacker as EM");
  // Anti-missile is a rating, not a percentage -- the text says the ratings add
  // and the resulting damage reduction caps at 75%, without giving the curve, so
  // the sheet shows the sum and stops there rather than inventing one.
  const amisRow = r.amis
    ? row("ANTI-MISSILE", `${num(r.amis)}`
        + `<span class="brk">pooled rating — incoming missile damage reduction caps at ${RES_CAP}%</span>`)
    : "";
  const defenseSection = section("DEFENSE", tbl(def + pools + amisRow) +
    `<div class="resgrid" style="margin-top:8px">${resCells}</div>${resNote}`);

  // -- offense ------------------------------------------------------------
  if (r.weapons.length) {
    const chips = Object.entries(r.byType).sort((a,b)=>b[1]-a[1]).map(([dt,v]) =>
      `<span class="dt dt-${dt}">${dt.toUpperCase()} ${num(v)}</span>`).join("");
    const wrows = r.weapons.map(m => {
      const w = m.w, mag = w.mag || 0, cd = w.cd || 0;
      const a = roundFor(w), dpt = w.dpt || 0;
      // A weapon whose type has no catalogued rounds has a degenerate span,
      // so collapse lo == hi rather than printing "30-30".
      const span = w.edpt || [dpt, dpt];
      const effCell = a ? num(dpt * (1 + a.dm))
        : span[0] === span[1] ? num(span[0])
        : `${num(span[0])}–${num(span[1])}`;
      // The Scrapgun is the one weapon whose ammo type has no catalogued
      // rounds: it feeds on salvage carried in the hold.
      const ammoCell = a ? esc(a.name)
        : w.ammo && !AMMO[w.ammo] ? `<em class="salv">salvage in hold</em>`
        : w.ammo ? `<em class="salv">none loaded</em>` : "—";
      return `<tr>
        <td>${esc(m.name)}</td><td>${num(w.dmg||0)}</td><td>${num(cd)}</td>
        <td>${num(dpt)}</td>
        <td>${effCell}</td>
        <td>${ammoCell}</td>
        <td>${mag ? num(mag) : "—"}</td>
        <td>${mag ? num((w.dmg||0)*mag) : "—"}</td>
        <td>${mag && cd ? num(mag*cd) : "—"}</td>
        <td>${w.ignres ? num(w.ignres)+"%" : "—"}</td>
        <td>${num(w.reach||w.rng||0)}</td>
        <td><span class="dt dt-${w.dt}">${(w.dt||"").toUpperCase()}</span></td>
      </tr>`;}).join("");
    // Everything a loaded round does that is NOT a flat damage change. Kept out
    // of the DPT figures on purpose: each of these applies only in some
    // matchups, and folding them in would quote damage the sheet cannot stand
    // behind -- the mistake the old VOLLEY row made.
    const fxRows = [...r.rounds.values()].filter(a => a.fx.length)
      .map(a => `<div class="ammofx"><b>${esc(a.name)}</b>${a.fx.map(esc).join(" &middot; ")}</div>`)
      .join("");
    out.push(section("OFFENSE",
      tbl(row("DAMAGE / TICK", `<b>${num(r.dpt)}</b>`)
        + row("EFFECTIVE DPT", r.edptLo === r.edptHi
            ? `<b>${num(r.edptLo)}</b>` + (r.rounds.size
                ? `<span class="brk">with the rounds loaded below the slots</span>` : "")
            : `<b>${num(r.edptLo)} – ${num(r.edptHi)}</b><span class="brk">` +
              (r.ammoPending ? `${r.ammoPending} weapon${r.ammoPending>1?"s have":" has"} no round loaded — span across every round that fits`
                             : `across every round that fits`) + `</span>`)
        + row("REACH", `${num(r.reach)}`)
        + row("ALPHA STRIKE", `<b>${num(r.alpha)}</b><span class="brk">one shot from every weapon</span>`)
        + row("DAMAGE TYPES", `<div class="chips">${chips}</div>`)
        + capRow("ESCAPE-SPEED PENALTY", r.web, "%", "applied to the selected target")
        + (fxRows ? row("AMMO EFFECTS", fxRows + `<span class="brk">not folded into the damage figures — each applies only in some matchups</span>`) : ""))
      + `<div class="wscroll"><table class="wlist"><thead><tr><th>WEAPON</th><th>DMG</th>
         <th title="Ticks between shots">CD</th><th title="Damage per tick">DPT</th>
         <th title="DPT with the loaded round, or the span across every round that fits when none is loaded">EFF DPT</th>
         <th title="The round loaded for this weapon's ammo type">AMMO</th>
         <th title="Rounds per magazine">MAG</th>
         <th title="Damage from one full magazine: damage x magazine size">MAG DMG</th>
         <th title="Ticks to fire the magazine dry: magazine size x cooldown">EMPTY IN</th>
         <th title="Share of the target's typed resistance this weapon ignores">BYPASS</th>
         <th>REACH</th><th>TYPE</th></tr></thead>
         <tbody>${wrows}</tbody></table></div>`));
  } else {
    out.push(section("OFFENSE",
      `<div class="noslots">NO WEAPONS FITTED</div>`));
  }
  out.push(defenseSection);

  // -- mobility & capacity ------------------------------------------------
  const rawSpeed = total(r.speed), speed = Math.min(rawSpeed, SPEED_CAP);
  let speedCell;
  if (rawSpeed > SPEED_CAP) {
    let brk = num(r.speed.base);
    if (r.speed.add) brk += ` <span class="plus">+${num(r.speed.add)}</span>`;
    if (r.speed.sub) brk += ` <span class="pen">&minus;${num(r.speed.sub)}</span>`;
    speedCell = `<b>${num(speed)}</b><span class="brk">(${brk} = ${num(rawSpeed)})</span>`
      + `<span class="cap">CAPPED AT ${SPEED_CAP} · ${num(rawSpeed - SPEED_CAP)} WASTED</span>`;
  } else {
    speedCell = val(r.speed);
  }
  let mob = row("SPEED", speedCell)
          + row("FUEL CAPACITY", val(r.fuel));
  if (total(r.feff)) mob += row("FUEL EFFICIENCY", val(r.feff, "%"));
  if (total(r.tow)) mob += row("TOW SPEED", val(r.tow));
  out.push(section("MOBILITY", tbl(mob)));

  let cap = row("CARGO", val(r.cargo));
  if (total(r.dcap) || total(r.dbw))
    cap += row("DRONE BAY", `${val(r.dcap)}<span class="brk">bandwidth ${num(total(r.dbw))}</span>`);
  for (const [k, v] of r.inherent) cap += row(k.toUpperCase(), `${num(v)}`);
  out.push(section("CAPACITY", tbl(cap)));

  // -- sensors, covert, industry (only what the fit actually has) ---------
  let sens = "";
  const opt = (k, a, u) => { if (total(a)) sens += row(k, val(a, u)); };
  opt("SCANNER POWER", r.scan); opt("CLOAK STRENGTH", r.cloak);
  opt("ACCURACY", r.acc_, "%"); opt("TRACKING", r.track, "%");
  opt("SIGNATURE", r.sig); opt("SURVEY POWER", r.spow);
  opt("SURVEY RANGE", r.srng); opt("HARVEST POWER", r.hpow);
  opt("HARVEST RANGE", r.hrng);
  out.push(section("SENSORS &amp; INDUSTRY", tbl(sens)));

  // -- features and requirements -----------------------------------------
  if (r.features.size) {
    const chips = [...r.features.entries()].sort().map(([f, srcs]) =>
      `<span class="chip" title="${esc([...srcs].join(", "))}">${esc(f)}</span>`).join("");
    out.push(section("MODULE FEATURES", `<div class="chips">${chips}</div>`));
  }
  if (s.special) {
    out.push(section("HULL SPECIAL",
      `<div class="chips"><span class="chip">${esc(titleCase(s.special))}</span></div>`));
  }
  const reqs = Object.entries(r.reqs).sort();
  if (reqs.length) {
    out.push(section("SKILL REQUIREMENTS", `<div class="chips">` +
      reqs.map(([k,v]) => `<span class="chip src">${esc(titleCase(k))} ${v}</span>`).join("") +
      `</div>`));
  }
  el("stats").innerHTML = out.join("");
}

function renderTitleBlock(r) {
  const s = r.ship, fitted = r.fitted.length;
  const cells = [
    ["VESSEL", s.name, true],
    ["CLASS", s.cls || "—"],
    ["TIER", `T${s.tier || 0}`],
  ];
  // The six starter hulls carry the same label the ship pages badge them with.
  if (s.starter) cells.push(["TYPE", "STARTER SHIP"]);
  cells.push(["ROLE", s.cat || "—"],
             ["MODULES", `${fitted} / ${(s.w||0)+(s.d||0)+(s.u||0)}`]);

  const tb = el("titleblock");
  // Column count varies with the optional cell, so the track list is built to
  // match: a wide vessel field, even middle fields, a slightly wider tail.
  tb.style.gridTemplateColumns = `2.2fr ${"1fr ".repeat(cells.length - 2)}1.1fr`;
  tb.innerHTML = cells.map(([k,v,big]) =>
    `<div class="tb${big?" big":""}"><span class="tk">${k}</span>
      <span class="tv" title="${esc(v)}">${esc(v)}</span></div>`).join("");
}

async function render() {
  // Before encodeState, so a newly fitted weapon's default round is already
  // loaded when the URL is written and does not show up as a pending change.
  autoloadAmmo();
  const url = encodeState();
  history.replaceState(null, "", url ? "?" + url : location.pathname);

  const r = compute();
  const s = r.ship;

  renderSlots();
  renderAmmoBar();
  meter("mCpu", r.cpuUsed, total(r.cpuCap));
  meter("mPwr", r.pwrUsed, total(r.pwrCap));
  renderStats(r);
  renderTitleBlock(r);

  var lb = el("legacyBanner");
  if (s.legacy) {
    lb.innerHTML = "LEGACY &middot; <b>" + esc(s.name) + "</b> is DISCONTINUED" +
      (typeof s.legacy === "string" ? " &mdash; last sold " + esc(fmtSnap(s.legacy)) : "") +
      " &middot; still flyable, no longer sold";
    lb.hidden = false;
  } else {
    lb.hidden = true;
  }

  const rp = ringPlan(r);
  const legend = el("ringLegend");
  if (!rp.shown) {
    legend.classList.add("none");
    legend.innerHTML = total(r.shield) > 0
      ? `SHIELDS TOO LOW TO PLOT`
      : `NO SHIELD ENVELOPE &middot; THIS HULL CARRIES NO SHIELDS`;
  } else {
    legend.classList.remove("none");
    legend.innerHTML =
      `<i class="swatch"></i><b>${rp.shown}</b> SHIELD TRACES` +
      `<span class="why">${rp.baseRings} BASE (T${s.tier || 0})` +
      (rp.nominal !== rp.base ? ` × ${num(rp.nominal)}/${num(rp.base||0)} SHIELD` : "") +
      (rp.lost ? ` · <i class="swatch dash"></i>${rp.lost} TRIMMED` : "") +
      `</span>`;
  }

  const plan = await loadPlan(state.ship);
  el("planWrap").innerHTML = drawPlan(plan, rp);
  el("planScale").textContent = plan ? "SURVEYED" : "NO PLAN ON FILE";

  const engPct = state.eng;
  el("engNote").innerHTML = engPct
    ? `&minus;${engPct}% CPU &amp; POWER`
    : "NO REDUCTION";

  el("footnote").innerHTML =
    `<b>ENGINEERING IS THE ONLY SKILL APPLIED.</b> Every figure here is the hull plus its `
    + `fitted modules; no combat skill is folded in, so a trained pilot reads better than `
    + `this sheet on every line. Not applied: `
    + `<b>Armor</b> (+1%/level armor and hull), <b>Shields</b> (+1%/level capacity, recharge `
    + `and shield resistance — that resistance is the first mitigation stage and applies only `
    + `while shields are up), <b>Gunnery</b> and <b>Weapons</b> (+1%/level damage each; on a `
    + `capital hull Gunnery is understood to pay twice, once for the damage type and again `
    + `for the capital bonus), <b>Tactics</b> (+1%/level accuracy, evasion and combat `
    + `speed), plus <b>Bounty Hunting</b>, <b>Piracy</b> and <b>Leadership</b>, which affect `
    + `payouts, loot and scan evasion rather than these stats. `
    + `<b>ENGINEERING</b> applies cost × (1 &minus; level/100), summing raw costs and `
    + `rounding once for the ship total, and rounding each module separately for its `
    + `own figure — both measured against the server, not inferred. Per-slot figures `
    + `therefore need not sum to the total; the server behaves the same way. `
    + `At level 100 modules cost nothing. `
    + `<b>SPEED</b> stops at ${SPEED_CAP} however many modules are fitted; anything past it `
    + `is shown as wasted rather than added. `
    + `<b>DAMAGE / TICK</b> assumes continuous fire and every shot landing: the catalog `
    + `carries no reload time, so each weapon holds its rate only until EMPTY IN, and `
    + `magazine figures are per-weapon because a 1000-round autocannon and a 7-round railgun `
    + `do not empty together. Note that <b>one attack is one volley</b> — every weapon in `
    + `range and off cooldown fires together and the whole volley takes a single to-hit roll, `
    + `so a wide weapon rack does not average its misses away the way separate rolls would. `
    + `Accuracy is not modelled here, but it costs a heavy fit more per miss than a light one. `
    + `<b>RESISTANCES</b> follow the order the devs published in v0.564.1 and repeat in the `
    + `module text: shield skill, then <b>typed</b> resistance, then <b>flat/adaptive</b>. `
    + `Bonuses add inside a bucket, each bucket stops at ${RES_CAP}%, and the two buckets then `
    + `multiply — so a fit can read past ${RES_CAP}% overall but never reaches immunity. A cell `
    + `showing two figures reads typed × flat; an <i>a</i> marker means an adaptive module `
    + `supplies the flat bucket, which covers every damage type. A <b>reactive</b> hardener `
    + `answers whichever type is incoming, so it joins the typed bucket on all six. `
    + `<b>POOLED EFFECTS</b> — flat/adaptive, phase dodge, energy reflect and the `
    + `escape-speed penalty — each add across copies and stop at ${RES_CAP}%, as their own `
    + `descriptions state; anything past the cap is shown as wasted, the way speed is. `
    + `<b>ANTI-MISSILE</b> is the one exception: the ratings pool, but the catalog does not `
    + `give the curve from rating to damage reduction, so the sheet shows the sum and the `
    + `documented ${RES_CAP}% ceiling rather than inventing a percentage. `
    + `<b>BYPASS</b> is the share of the target's typed resistance a weapon ignores. `
    + `<b>CLOAK</b> takes the strongest fitted rating rather than summing. `
    + `<b>SHIELD TRACES</b> = (2 + tier &minus; 1) × total/base shields, `
    + `${RING_GAP_PX}px apart; trimmed traces show dashed grey.`;
}

/* -------------------------------------------------------------------- init */
function init() {
  // Ship picker, grouped by role so 338 hulls stay navigable.
  const byCat = {};
  for (const s of Object.values(SHIPS)) (byCat[s.cat || "Other"] ||= []).push(s);
  el("ship").innerHTML = Object.keys(byCat).sort().map(cat =>
    `<optgroup label="${esc(cat)}">` + byCat[cat]
      .sort((a,b) => a.name.localeCompare(b.name))
      .map(s => `<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.cls||"")} T${s.tier || 0} · ${s.w||0}/${s.d||0}/${s.u||0}${s.legacy ? " · LEGACY" : ""}</option>`)
      .join("") + `</optgroup>`).join("");
  el("ship").value = state.ship;

  el("ship").onchange = e => {
    state.ship = e.target.value;
    loadStock();                    // slots differ per hull; open on stock
    render();
  };
  el("btnStock").onclick = () => { loadStock(); render(); };
  el("themeBtn").onclick = () => {
    const cur = THEMES.indexOf(theme);
    applyTheme(THEMES[(cur + 1) % THEMES.length]);
    render();               // shield-ring flood colors are resolved per render
  };
  el("btnExport").onclick = () => {
    // combat-sim fitting spec (data/combat-sim/README.md). The sheet does not
    // model pilot skills, so they export as a zero scaffold to edit by hand.
    const ship = SHIPS[state.ship];
    const modules = [];
    for (const slot of ["weapon","defense","utility"])
      for (const id of state.fit[slot]) if (id) modules.push(id);
    const spec = JSON.stringify({
      name: ship.name + " fit",
      hull: state.ship,
      modules,
      skills: {weapons:0, gunnery:0, shields:0, armor:0},
    }, null, 2) + "\n";
    if (navigator.clipboard) navigator.clipboard.writeText(spec).catch(() => {});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([spec], {type:"application/json"}));
    a.download = "fit-" + state.ship + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  el("btnStrip").onclick = () => {
    state.fit = {weapon:[], defense:[], utility:[]};
    state.stock = {missing:[], overflow:[]};
    render();
  };
  const setEng = v => {
    state.eng = Math.max(0, Math.min(100, Math.round(+v || 0)));
    el("engRange").value = el("engNum").value = state.eng;
    render();
  };
  el("engRange").oninput = e => setEng(e.target.value);
  el("engNum").oninput = e => setEng(e.target.value);
  // The unit conversion depends on the rendered panel width, so redraw on resize.
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });

  decodeState(location.search.slice(1));
  el("ship").value = state.ship;
  el("engRange").value = el("engNum").value = state.eng;
  render();
}
init();
</script>
</body>
</html>
