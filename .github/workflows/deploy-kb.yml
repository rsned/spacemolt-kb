name: Deploy Knowledge Base

on:
  push:
    branches: [main]
    # overlays/** so portrait-only changes (images live in overlays/, the kb/
    # copies are gitignored) still trigger a redeploy. data/footprints/** for
    # the same reason: the footprint SVG bundle is rebuilt into kb/ at deploy
    # time from those committed SVGs, so a fleet change must redeploy too.
    paths:
      - kb/**
      - overlays/**
      - data/footprints/**
      - data/mesh_bakeoff/export_view_svgs.py
      - scripts/inject-overlay-images.sh
      - scripts/build-footprint-zip.sh
      - scripts/build-fitting-plans.sh
      - scripts/build-ship-footprints.sh
      - scripts/build-search-index.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Inject overlay images into kb/
        run: ./scripts/inject-overlay-images.sh
      - name: Build footprint SVG bundle into kb/
        run: ./scripts/build-footprint-zip.sh
      - name: Stage fitting plan views into kb/
        run: ./scripts/build-fitting-plans.sh
      - name: Stage ship footprint outlines into kb/
        run: ./scripts/build-ship-footprints.sh
      - name: Build the site search index into kb/
        run: ./scripts/build-search-index.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: kb/
      - id: deployment
        uses: actions/deploy-pages@v5
