name: Deploy Knowledge Base

on:
  push:
    branches: [main]
    # overlays/** so portrait-only changes (images live in overlays/, the kb/
    # copies are gitignored) still trigger a redeploy.
    paths:
      - kb/**
      - overlays/**
      - scripts/inject-overlay-images.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject overlay images into kb/
        run: ./scripts/inject-overlay-images.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kb/
      - id: deployment
        uses: actions/deploy-pages@v4
