version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  default: standard
  disable:
    # depguard v2.4.0 has a known issue: it applies an implicit "Main" whitelist rule
    # that overrides our allow list, blocking ALL imports regardless of configuration.
    # Workaround: cgo is blocked by Go's type checker when building for Wasm anyway,
    # so depguard filtering is not critical for Phase 0. Re-enable when v2.5+ is available.
    - depguard
    - govet
    - staticcheck
