version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  default: standard
  enable:
    - depguard

  settings:
    staticcheck:
      checks:
        - all
        # QF1012 (prefer fmt.Fprintf over WriteString(fmt.Sprintf(...))) arrived
        # in staticcheck via golangci-lint v2.13.1 and immediately flagged 366
        # pre-existing sites across 11 files in the HTML generators. It is a
        # style quickfix, not a correctness check — Fprintf to a strings.Builder
        # cannot fail — so it is not worth a repo-wide mechanical edit. Drop this
        # line if that cleanup ever happens.
        - "-QF1012"

    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/rsned/spacemolt-kb
            - github.com/ojrac/opensimplex-go
            - github.com/lucasb-eyer/go-colorful
            - github.com/dustin/go-humanize
            - github.com/anthropics/anthropic-sdk-go
            - github.com/google/uuid
            - github.com/mattn/go-isatty
            - github.com/ncruces/go-strftime
            - github.com/remyoudompheng/bigfft
            - github.com/tidwall
            - modernc.org/sqlite
            - modernc.org/libc
            - modernc.org/mathutil
            - modernc.org/memory
            - golang.org/x
          deny:
            - pkg: "C"
              desc: "cgo is forbidden; pkg/planetgen and cmd/planet-explorer must compile to Wasm"

  # Pre-existing findings deferred from Phase 0 scope; address in their own
  # cleanup task. New code in pkg/planetgen, cmd/generate-planet-maps, and
  # cmd/tools must remain clean.
  exclusions:
    rules:
      - path: pkg/planetgen/profile.go
        text: "composites:"
        linters: [govet]
      - path: cmd/generate-galaxy-map/main.go
        linters: [staticcheck]
      - path: pkg/systemmap/planets.go
        linters: [staticcheck]
